# Cloud deployment: PetraPMS + PostgreSQL.   cd docker && cp .env.example .env && edit .env && docker compose up -d
# Put a TLS-terminating reverse proxy (Caddy / nginx / Traefik) in front for HTTPS; do not expose port 3000 directly.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: petra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: petrapms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petra -d petrapms"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgresql://petra:${POSTGRES_PASSWORD}@db:5432/petrapms
      PETRA_REALTIME: postgres
    volumes:
      - appdata:/data
    ports:
      - "${PETRA_PORT:-3000}:3000"
volumes:
  pgdata:
  appdata:
